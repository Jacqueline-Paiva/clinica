<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Paciente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="text-center mb-4">
                <h1>Cadastro de Paciente</h1>

                <p class="text-muted">
                    Faça seu cadastro para acessar o sistema e agendar suas consultas.
                </p>
            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form th:object="${paciente}"
                          th:action="@{/cadastro}"
                          method="post"
                          novalidate>

                        <h5 class="mb-3">Dados pessoais</h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Nome
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       th:field="*{nome}"
                                       placeholder="Seu nome">

                                <div class="invalid-feedback"
                                     th:errors="*{nome}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    CPF
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                       th:field="*{cpf}"
                                       placeholder="000.000.000-00">

                                <div class="invalid-feedback"
                                     th:errors="*{cpf}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    E-mail
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       th:field="*{email}"
                                       placeholder="email@exemplo.com">

                                <div class="invalid-feedback"
                                     th:errors="*{email}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Telefone
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                       th:field="*{telefone}"
                                       placeholder="(00) 00000-0000">

                                <div class="invalid-feedback"
                                     th:errors="*{telefone}">
                                </div>

                            </div>

                        </div>

                        <hr class="my-4">

                        <h5 class="mb-3">
                            Dados de acesso
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Usuário
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('usuario.usuario')} ? 'is-invalid'"
                                       th:field="*{usuario.usuario}"
                                       placeholder="Escolha um usuário">

                                <div class="invalid-feedback"
                                     th:errors="*{usuario.usuario}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Senha
                                </label>

                                <input type="password"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('usuario.senha')} ? 'is-invalid'"
                                       th:field="*{usuario.senha}"
                                       placeholder="Escolha uma senha">

                                <div class="invalid-feedback"
                                     th:errors="*{usuario.senha}">
                                </div>

                            </div>

                        </div>

                        <div class="d-grid gap-2 mt-3">

                            <button type="submit"
                                    class="btn btn-primary">
                                Criar minha conta
                            </button>

                            <a th:href="@{/login}"
                               class="btn btn-outline-secondary">
                                Já tenho cadastro
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
    <script th:src="@{/js/mascaras.js}"></script>
</body>

</html>
