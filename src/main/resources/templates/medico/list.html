<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Médicos</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Clínica
        </div>

        <nav>
            <a th:href="@{/}">Início</a>
            <a th:href="@{/pacientes}">Pacientes</a>
            <a th:href="@{/medicos}">Médicos</a>
            <a th:href="@{/consultas}">Consultas</a>
        </nav>

    </header>

    <main class="container container-wide">

        <div class="page-header">

            <div>
                <h1>Médicos</h1>

                <p class="subtitle">
                    Médicos cadastrados na clínica
                </p>
            </div>

            <a class="btn btn-primary"
               th:href="@{/medicos/novo}">
                + Novo médico
            </a>

        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}"
             class="alert alert-error"
             th:text="${erro}">
        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${sucesso}"
             class="alert alert-success"
             th:text="${sucesso}">
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>CRM</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="medico : ${medicos}">

                        <td th:text="${medico.id}"></td>

                        <td th:text="${medico.nome}"></td>

                        <td th:text="${medico.cpf}"></td>

                        <td th:text="${medico.email}"></td>

                        <td th:text="${medico.telefone}"></td>

                        <td th:text="${medico.crm}"></td>

                        <td>

                            <a class="btn btn-primary"
                               th:href="@{/medicos/{id}/consultas(id=${medico.id})}">
                                Agenda
                            </a>

                            <a class="btn btn-secondary"
                               th:href="@{/medicos/editar/{id}(id=${medico.id})}">
                                Editar
                            </a>

                            <a class="btn btn-danger"
                               th:href="@{/medicos/excluir/{id}(id=${medico.id})}">
                                Excluir
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</body>

</html>
