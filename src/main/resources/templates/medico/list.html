<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Médicos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Médicos</h1>

            <p class="text-muted mb-0">
                Médicos cadastrados na clínica
            </p>
        </div>

        <a class="btn btn-primary"
           th:href="@{/medicos/novo}">
            + Novo médico
        </a>

    </div>

    <!-- Mensagem de erro -->
    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <!-- Mensagem de sucesso -->
    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>CRM</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="medico : ${medicos}">

                    <td th:text="${medico.nome}"></td>

                    <td th:text="${medico.cpf}"></td>

                    <td th:text="${medico.email}"></td>

                    <td th:text="${medico.telefone}"></td>

                    <td th:text="${medico.crm}"></td>

                    <td class="text-nowrap">

                        <a class="btn btn-primary btn-sm"
                           th:href="@{/medicos/{id}/consultas(id=${medico.id})}">
                            Agenda
                        </a>

                        <a class="btn btn-secondary btn-sm"
                           th:href="@{/medicos/editar/{id}(id=${medico.id})}">
                            Editar
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/medicos/excluir/{id}(id=${medico.id})}">
                            Excluir
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
