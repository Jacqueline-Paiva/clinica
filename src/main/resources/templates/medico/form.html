<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Médico</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="mb-4">
        <h1 th:text="${medico.id == null ? 'Novo Médico' : 'Editar Médico'}">
            Médico
        </h1>

        <p class="text-muted">
            Preencha os dados do médico.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:object="${medico}"
                  th:action="${medico.id == null ? '/medicos/salvar' : '/medicos/atualizar'}"
                  method="post"
                  novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nome</label>

                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               type="text"
                               th:field="*{nome}"
                               placeholder="Nome do médico">

                        <div class="invalid-feedback"
                             th:errors="*{nome}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">CPF</label>

                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                               type="text"
                               th:field="*{cpf}"
                               placeholder="000.000.000-00">

                        <div class="invalid-feedback"
                             th:errors="*{cpf}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">E-mail</label>

                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               type="email"
                               th:field="*{email}"
                               placeholder="email@exemplo.com">

                        <div class="invalid-feedback"
                             th:errors="*{email}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telefone</label>

                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                               type="text"
                               th:field="*{telefone}"
                               placeholder="(00) 00000-0000">

                        <div class="invalid-feedback"
                             th:errors="*{telefone}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">CRM</label>

                        <input class="form-control"
                               th:classappend="${#fields.hasErrors('crm')} ? 'is-invalid'"
                               type="text"
                               th:field="*{crm}"
                               placeholder="Ex.: CRM-TO 1234">

                        <div class="invalid-feedback"
                             th:errors="*{crm}">
                        </div>
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Salvar
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/medicos}">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</main>

</body>
</html>
