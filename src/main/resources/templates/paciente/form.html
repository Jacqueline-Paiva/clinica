<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container app-content">

    <!-- CABEÇALHO -->

    <div class="page-header">

        <div>

            <span class="eyebrow">
                Cadastro
            </span>

            <h1 th:text="${paciente.id == null
                         ? 'Novo paciente'
                         : 'Editar paciente'}">
                Novo paciente
            </h1>

            <p th:text="${paciente.id == null
                        ? 'Cadastre os dados pessoais e o acesso do paciente.'
                        : 'Atualize os dados cadastrais do paciente.'}">
            </p>

        </div>

    </div>


    <!-- FORMULÁRIO -->

    <form th:object="${paciente}"
          th:action="${paciente.id == null
                     ? '/pacientes/salvar'
                     : '/pacientes/atualizar'}"
          method="post">

        <input type="hidden"
               th:if="${paciente.id != null}"
               th:field="*{id}">


        <!-- DADOS PESSOAIS -->

        <section class="card border-0 shadow-sm mb-4">

            <div class="card-body p-4">

                <div class="mb-4">

                    <span class="eyebrow">
                        Paciente
                    </span>

                    <h2 class="fs-5 mb-1">
                        Dados pessoais
                    </h2>

                    <p class="text-secondary small mb-0">
                        Informe os dados de identificação e contato.
                    </p>

                </div>


                <div class="row g-4">

                    <!-- NOME -->

                    <div class="col-12">

                        <label for="nome"
                               class="form-label fw-semibold">
                            Nome completo
                        </label>

                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               class="form-control"
                               placeholder="Nome completo do paciente">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}">
                        </div>

                    </div>


                    <!-- CPF -->

                    <div class="col-md-6">

                        <label for="cpf"
                               class="form-label fw-semibold">
                            CPF
                        </label>

                        <input type="text"
                               id="cpf"
                               th:field="*{cpf}"
                               class="form-control mascara-cpf"
                               maxlength="14"
                               inputmode="numeric"
                               placeholder="000.000.000-00">

                        <div class="form-text">
                            Digite apenas os números. A formatação é automática.
                        </div>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('cpf')}"
                             th:errors="*{cpf}">
                        </div>

                    </div>


                    <!-- TELEFONE -->

                    <div class="col-md-6">

                        <label for="telefone"
                               class="form-label fw-semibold">
                            Telefone
                        </label>

                        <input type="text"
                               id="telefone"
                               th:field="*{telefone}"
                               class="form-control mascara-telefone"
                               maxlength="15"
                               inputmode="numeric"
                               placeholder="(00) 00000-0000">

                        <div class="form-text">
                            DDD + número do telefone.
                        </div>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}">
                        </div>

                    </div>


                    <!-- E-MAIL -->

                    <div class="col-12">

                        <label for="email"
                               class="form-label fw-semibold">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="paciente@email.com">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- ACESSO AO SISTEMA
             SOMENTE NO NOVO CADASTRO -->

        <section class="card border-0 shadow-sm mb-4"
                 th:if="${paciente.id == null}">

            <div class="card-body p-4">

                <div class="mb-4">

                    <span class="eyebrow">
                        Acesso
                    </span>

                    <h2 class="fs-5 mb-1">
                        Credenciais do paciente
                    </h2>

                    <p class="text-secondary small mb-0">
                        Estes dados serão utilizados para acessar o sistema.
                    </p>

                </div>


                <div class="row g-4">

                    <!-- USUÁRIO -->

                    <div class="col-md-6">

                        <label for="usuario"
                               class="form-label fw-semibold">
                            Usuário
                        </label>

                        <input type="text"
                               id="usuario"
                               th:field="*{usuario.usuario}"
                               class="form-control"
                               autocomplete="username"
                               placeholder="Nome de usuário">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('usuario.usuario')}"
                             th:errors="*{usuario.usuario}">
                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="col-md-6">

                        <label for="senha"
                               class="form-label fw-semibold">
                            Senha
                        </label>

                        <input type="password"
                               id="senha"
                               th:field="*{usuario.senha}"
                               class="form-control"
                               autocomplete="new-password"
                               placeholder="Senha de acesso">

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('usuario.senha')}"
                             th:errors="*{usuario.senha}">
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- BOTÕES -->

        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-2
                    pb-4">

            <a th:href="@{/pacientes}"
               class="btn btn-outline-secondary">
                ← Cancelar
            </a>


            <button type="submit"
                    class="btn btn-primary px-4"
                    th:text="${paciente.id == null
                             ? 'Cadastrar paciente'
                             : 'Salvar alterações'}">
                Cadastrar paciente
            </button>

        </div>

    </form>


    <!-- MÁSCARAS -->

    <script th:src="@{/js/mascaras.js}"></script>

</main>

</body>
</html>
