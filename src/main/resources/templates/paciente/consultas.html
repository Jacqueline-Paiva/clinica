<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Consultas do Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Consultas do Paciente</h1>

            <p class="text-muted mb-0">
                Histórico de consultas de
                <strong th:text="${paciente.nome}"></strong>
            </p>
        </div>

        <a class="btn btn-secondary"
           th:href="@{/pacientes}">
            Voltar
        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">
                <tr>
                    <th>Data e hora</th>
                    <th>Médico</th>
                    <th>Valor</th>
                    <th>Observação</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="consulta : ${consultas}">

                    <td>
                        <span th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy')}">
                        </span>

                        <span class="d-block text-muted small"
                              th:text="'às ' + ${#temporals.format(consulta.data, 'HH:mm')}">
                        </span>
                    </td>

                    <td th:text="${consulta.medico.nome}"></td>

                    <td th:text="'R$ ' + ${#numbers.formatDecimal(consulta.valor, 1, 2)}">
                    </td>

                    <td th:text="${consulta.observacao}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(consultas)}">
                    <td colspan="4"
                        class="text-center text-muted py-4">
                        Este paciente ainda não possui consultas cadastradas.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
