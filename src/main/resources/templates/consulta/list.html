<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Consultas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Consultas</h1>

            <p class="text-muted mb-0">
                Consultas cadastradas na clínica
            </p>
        </div>

        <a class="btn btn-primary"
           th:href="@{/consultas/nova}">
            + Nova consulta
        </a>

    </div>

    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">
                <tr>
                    <th>Data e hora</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Valor</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="consulta : ${consultas}">

                    <td>
                        <span th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy')}">
                        </span>

                        <span class="d-block text-muted small"
                              th:text="'às ' + ${#temporals.format(consulta.data, 'HH:mm')}">
                        </span>
                    </td>

                    <td th:text="${consulta.paciente.nome}"></td>

                    <td th:text="${consulta.medico.nome}"></td>

                    <td th:text="'R$ ' + ${#numbers.formatDecimal(consulta.valor, 1, 2)}">
                    </td>

                    <td th:text="${consulta.observacao}"></td>

                    <td class="text-nowrap">

                        <a class="btn btn-secondary btn-sm"
                           th:href="@{/consultas/editar/{id}(id=${consulta.id})}">
                            Editar
                        </a>

                        <a sec:authorize="hasRole('ADMIN')"
                           class="btn btn-danger btn-sm"
                           th:href="@{/consultas/excluir/{id}(id=${consulta.id})}">
                            Excluir
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
