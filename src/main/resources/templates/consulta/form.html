<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">

    <title>Atendimento da Consulta</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<main class="container py-5">

    <div class="mb-4">

        <h1>Atendimento da Consulta</h1>

        <p class="text-muted">
            Preencha as informações do atendimento realizado.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:object="${consulta}"
                  th:action="@{/consultas/atualizar}"
                  method="post"
                  novalidate>

                <input type="hidden"
                       th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Paciente
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${consulta.paciente.nome}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Médico
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${consulta.medico.nome}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${#temporals.format(
                                    consulta.data,
                                    'dd/MM/yyyy HH:mm'
                               )}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="valor"
                               class="form-label">
                            Valor da consulta
                        </label>

                        <input id="valor"
                               type="number"
                               step="0.01"
                               min="0.01"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'"
                               th:field="*{valor}"
                               placeholder="0,00">

                    <div class="text-danger mt-1"
                                th:if="${erroValor}"
                                th:text="${erroValor}">
                    </div>

                    </div>

                    <div class="col-12 mb-3">

                        <label for="observacao"
                               class="form-label">
                            Observação
                        </label>

                        <textarea id="observacao"
                                  class="form-control"
                                  th:field="*{observacao}"
                                  rows="5"
                                  placeholder="Informações e observações sobre o atendimento">
                        </textarea>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Salvar atendimento
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/consultas}">
                    Voltar
                </a>

            </form>

        </div>

    </div>

</main>

</body>
</html>
